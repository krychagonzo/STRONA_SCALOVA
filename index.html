<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO meta (title/description/canonical/og/twitter) set per-route via src/components/Seo.jsx (React 19). Intentionally no static title/description here. -->

    <!-- Preload Critical Assets for LCP and Layout Stability -->
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/LOGO_AKCENT.png" as="image" fetchpriority="high">
    <link rel="preload" href="/ANIM_05_LOGO_1.webm" as="video" type="video/webm">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-obsidian text-ivory antialiased overflow-x-hidden selection:bg-accent selection:text-obsidian relative">
    <!-- High-performance Noise Overlay -->
    <div class="noise-overlay"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Global prevention of right-clicking images
      document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG') {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
